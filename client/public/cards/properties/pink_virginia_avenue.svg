<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 336" width="240" height="336">
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#181818" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Card Base with Color Accent Border -->
  <rect x="2" y="2" width="236" height="332" rx="10" fill="#0c0c0c" stroke="#D10069" stroke-width="3"/>
  <rect x="8" y="8" width="224" height="320" rx="8" fill="url(#grid)"/>

  <!-- Top Header Banner if Property/Wildcard -->
  
    <!-- Solid Color Header Banner -->
    <rect x="10" y="10" width="220" height="58" rx="6" fill="#D10069"/>
    <rect x="10" y="56" width="220" height="12" fill="#D10069"/>
    <line x1="10" y1="68" x2="230" y2="68" stroke="#000000" stroke-width="2"/>
    <text x="120" y="44" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1" stroke="#000000" stroke-width="0.5">PINK</text>
    

  <!-- Value Pill in Corner -->
  <circle cx="34" cy="92" r="15" fill="#000000" stroke="#71717a" stroke-width="2"/>
  <text x="34" y="96" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">$2M</text>

  <!-- Type Label -->
  <text x="218" y="94" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1.5">PROPERTY</text>

  <!-- Center Card Title & Symbol -->
  <g transform="translate(120, 160)">
    <!-- Decorative Center Icon -->
    <circle cx="0" cy="-22" r="26" fill="#141414" stroke="#D10069" stroke-width="2"/>
    <text x="0" y="-16" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">$2M</text>
    
    <!-- Title -->
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      Virginia Avenue
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="216" x2="216" y2="216" stroke="#333333" stroke-width="1"/>

  <!-- Description Box -->
  <text x="120" y="236" fill="#d4d4d8" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">
    <tspan x="120" dy="0">Pink Property (3 cards for</tspan><tspan x="120" dy="16">full set).</tspan>
  </text>

  <!-- Bottom Bar with Value -->
  <rect x="18" y="295" width="204" height="22" rx="4" fill="#171717" stroke="#262626" stroke-width="1"/>
  <text x="28" y="309" fill="#71717a" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">MONOPOLY DEAL</text>
  <text x="212" y="309" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="end">$2M</text>
</svg>